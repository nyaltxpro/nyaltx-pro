<svg width="1600" height="200" viewBox="0 0 1600 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4aa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00d4aa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1600" height="200" fill="url(#bg)"/>
  
  <!-- Accent line at top -->
  <rect width="1600" height="2" fill="url(#accent)" opacity="0.6"/>
  
  <!-- Main content area -->
  <g transform="translate(80, 50)">
    <!-- NYALTX Logo/Title -->
    <text x="0" y="30" font-family="Space Grotesk, Arial, sans-serif" font-size="32" font-weight="bold" fill="url(#textGradient)">NYALTX</text>
    
    <!-- Main heading -->
    <text x="0" y="70" font-family="Poppins, Arial, sans-serif" font-size="28" font-weight="600" fill="white">Unlock Premium Features</text>
    
    <!-- Subheading -->
    <text x="0" y="100" font-family="Poppins, Arial, sans-serif" font-size="16" fill="#a0a0a0">Choose your plan and start trading with advanced tools</text>
    
    <!-- Feature highlights -->
    <g transform="translate(0, 120)">
      <circle cx="8" cy="8" r="3" fill="#00d4aa"/>
      <text x="20" y="12" font-family="Poppins, Arial, sans-serif" font-size="14" fill="#e0e0e0">Advanced Analytics</text>
      
      <circle cx="180" cy="8" r="3" fill="#00d4aa"/>
      <text x="192" y="12" font-family="Poppins, Arial, sans-serif" font-size="14" fill="#e0e0e0">Priority Support</text>
      
      <circle cx="320" cy="8" r="3" fill="#00d4aa"/>
      <text x="332" y="12" font-family="Poppins, Arial, sans-serif" font-size="14" fill="#e0e0e0">Exclusive Features</text>
    </g>
  </g>
  
  <!-- Right side - Call to action -->
  <g transform="translate(1200, 60)">
    <!-- CTA Button -->
    <rect x="0" y="20" width="300" height="50" rx="25" fill="url(#accent)" opacity="0.2"/>
    <rect x="2" y="22" width="296" height="46" rx="23" fill="none" stroke="url(#accent)" stroke-width="1"/>
    <text x="150" y="50" font-family="Poppins, Arial, sans-serif" font-size="16" font-weight="600" fill="white" text-anchor="middle">Explore Pricing Plans →</text>
    
    <!-- Pricing preview -->
    <text x="150" y="100" font-family="Poppins, Arial, sans-serif" font-size="12" fill="#a0a0a0" text-anchor="middle">Starting from $9.99/month</text>
  </g>
  
  <!-- Decorative elements -->
  <g opacity="0.1">
    <circle cx="1400" cy="50" r="30" fill="url(#accent)"/>
    <circle cx="1450" cy="150" r="20" fill="url(#accent)"/>
    <circle cx="100" cy="170" r="15" fill="url(#accent)"/>
  </g>
  
  <!-- Bottom accent line -->
  <rect y="198" width="1600" height="2" fill="url(#accent)" opacity="0.6"/>
</svg>
