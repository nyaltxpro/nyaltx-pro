query generalStatement($relativePath: String!) {
  generalStatement(relativePath: $relativePath) {
    ... on Document {
      _sys {
        filename
        basename
        hasReferences
        breadcrumbs
        path
        relativePath
        extension
      }
      id
    }
    ...GeneralStatementParts
  }
}

query generalStatementConnection($before: String, $after: String, $first: Float, $last: Float, $sort: String, $filter: GeneralStatementFilter) {
  generalStatementConnection(
    before: $before
    after: $after
    first: $first
    last: $last
    sort: $sort
    filter: $filter
  ) {
    pageInfo {
      hasPreviousPage
      hasNextPage
      startCursor
      endCursor
    }
    totalCount
    edges {
      cursor
      node {
        ... on Document {
          _sys {
            filename
            basename
            hasReferences
            breadcrumbs
            path
            relativePath
            extension
          }
          id
        }
        ...GeneralStatementParts
      }
    }
  }
}

